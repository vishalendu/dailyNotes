[package]
name = "daily-notes"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sqlite-vec = "0.1.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
fs2 = "0.4"
flate2 = "1"
font-kit = "0.14.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
fastembed = { version = "7.0.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
